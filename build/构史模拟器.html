<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>构史模拟器</title>
  <style>
/* ========== 构史模拟器 - 样式表 ========== */

:root {
  --bg-primary: #1a120b;
  --bg-secondary: #231b12;
  --bg-card: #2c2218;
  --bg-card-hover: #3a2e20;
  --border-color: #5c3d2e;
  --border-gold: #8b6914;
  --text-primary: #e8d5b7;
  --text-secondary: #b8a088;
  --text-muted: #7a6a58;
  --accent-gold: #d4a843;
  --accent-red: #c43d3d;
  --accent-green: #5a9e6f;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  --font-title: 'SimSun', 'STSong', 'Noto Serif SC', '宋体', serif;
  --font-body: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(180, 140, 60, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(180, 140, 60, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 20% 80%, rgba(90, 158, 111, 0.03) 0%, transparent 40%);
  background-attachment: fixed;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1500px;
  margin: 0 auto;
}

/* ========== Header (固定在顶部) ========== */
#header {
  flex-shrink: 0;
  z-index: 100;
  background: linear-gradient(180deg, rgba(26, 18, 11, 0.98) 70%, rgba(26, 18, 11, 0.85));
  padding: 8px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(8px);
}

.game-title {
  font-family: var(--font-title);
  font-size: 1.4rem;
  color: var(--accent-gold);
  letter-spacing: 0.25em;
  text-shadow: 0 0 30px rgba(212, 168, 67, 0.4), 0 2px 4px rgba(0,0,0,0.5);
  animation: titleGlow 4s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  from { text-shadow: 0 0 20px rgba(212, 168, 67, 0.3), 0 2px 4px rgba(0,0,0,0.5); }
  to { text-shadow: 0 0 40px rgba(212, 168, 67, 0.6), 0 2px 8px rgba(212, 168, 67, 0.3); }
}

#round-info {
  font-family: var(--font-title);
  font-size: 1.2rem;
  color: var(--text-secondary);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 6px 16px;
}
#round-num {
  color: var(--accent-gold);
  font-size: 1.5rem;
  font-weight: bold;
}

/* ========== Main Content (可滚动) ========== */
#main-content {
  flex: 1;
  overflow-y: auto;
  padding: 8px 24px 32px;
}

.screen {
  max-width: 1000px;
  margin: 0 auto;
  padding-top: 4px;
  animation: fadeSlideIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(30px); filter: blur(4px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.hidden { display: none !important; }

.phase-title {
  font-family: var(--font-title);
  font-size: 1.6rem;
  color: var(--accent-gold);
  text-align: center;
  margin: 0 0 4px;
}
.phase-desc {
  text-align: center;
  color: var(--text-secondary);
  margin-bottom: 14px;
  font-size: 0.95rem;
}

/* ========== Start Screen ========== */
.start-container {
  text-align: center;
  padding: 40px 20px 60px;
}
.emblem {
  font-size: 5rem;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.start-container h2 {
  font-family: var(--font-title);
  font-size: 2.2rem;
  color: var(--accent-gold);
  margin-bottom: 12px;
}
.subtitle {
  color: var(--text-secondary);
  font-size: 1.1rem;
  margin-bottom: 40px;
}

.api-config {
  max-width: 450px;
  margin: 0 auto 24px;
}

.api-key-section {
  margin-bottom: 16px;
}

.api-key-field {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 0.95rem;
  font-family: monospace;
  transition: border-color 0.3s, box-shadow 0.3s;
  outline: none;
}
.api-key-field:focus {
  border-color: var(--accent-gold);
  box-shadow: 0 0 15px rgba(212, 168, 67, 0.25);
}
.api-key-field::placeholder {
  color: var(--text-muted);
}

.hint {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ========== Buttons ========== */
.btn-primary {
  display: inline-block;
  padding: 14px 48px;
  font-family: var(--font-title);
  font-size: 1.2rem;
  color: #1a120b;
  background: linear-gradient(135deg, #d4a843, #b8860b);
  border: 2px solid #8b6914;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 0.1em;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(180, 140, 60, 0.3);
}
.btn-primary:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(180, 140, 60, 0.5);
}
.btn-primary:active:not(:disabled) {
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  filter: grayscale(60%);
}

/* ========== Countries Grid ========== */
.countries-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  margin-top: 12px;
}

.country-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: 12px;
  padding: 24px 18px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: center;
  position: relative;
  overflow: hidden;
  width: 220px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  min-height: 220px;
}
.country-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}
.country-card:hover {
  border-color: var(--border-gold);
  transform: translateY(-6px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 168, 67, 0.1);
}
.country-card:hover::before { opacity: 1; }
.country-card.selected {
  border-color: var(--accent-gold);
  box-shadow: 0 0 40px rgba(212, 168, 67, 0.25), 0 8px 30px rgba(0, 0, 0, 0.5);
}
.country-card.selected::before { opacity: 1; }

.country-name {
  font-family: var(--font-title);
  font-size: 1.6rem;
  color: var(--accent-gold);
  margin-bottom: 12px;
}
.country-background {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 8px;
  flex: 1;
}
.country-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  font-size: 0.85rem;
  margin-top: auto;
  padding-top: 12px;
}
.stat-item {
  text-align: center;
}
.stat-icon { font-size: 1.3rem; }
.stat-value {
  font-size: 1.2rem;
  font-weight: bold;
  color: var(--text-primary);
}
.stat-label {
  color: var(--text-muted);
  font-size: 0.75rem;
}

/* ========== Events ========== */
.events-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.event-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 60px;
  max-height: 58vh;
  overflow-y: auto;
  padding: 6px;
  border-radius: 8px;
}

.events-pool h3, .events-selected h3 {
  font-family: var(--font-title);
  color: var(--text-secondary);
  margin: 0 0 6px;
  font-size: 0.95rem;
}

#events-pool-list {
  background: rgba(44, 34, 24, 0.3);
}
#events-selected-list {
  background: rgba(180, 140, 60, 0.05);
  border: 1px dashed var(--border-gold);
}

.event-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  user-select: none;
}
.event-card:hover {
  border-color: var(--border-gold);
  background: var(--bg-card-hover);
  transform: translateX(4px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.event-card.in-selected {
  border-color: var(--accent-gold);
  cursor: grab;
  padding-left: 36px;
}
.event-card.in-selected:active {
  cursor: grabbing;
}
.event-card.in-selected::before {
  content: '⋮⋮';
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 1rem;
  letter-spacing: -2px;
  pointer-events: none;
}
.event-card.drag-over {
  border-color: var(--accent-gold);
  border-style: dashed;
  background: rgba(212, 168, 67, 0.12);
  transform: translateX(4px) scale(1.02);
}
.event-card.dragging {
  opacity: 0.5;
  transform: rotate(2deg) scale(0.97);
}
.event-card .event-title {
  font-weight: bold;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.event-card .event-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.event-card .event-effects {
  display: flex;
  gap: 12px;
  font-size: 0.8rem;
}
.effect-positive { color: var(--accent-green); }
.effect-negative { color: var(--accent-red); }
.effect-zero { color: var(--text-muted); }

.event-card .event-target {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 0.7rem;
  color: var(--text-muted);
  background: rgba(0,0,0,0.3);
  padding: 2px 8px;
  border-radius: 4px;
}

/* ========== History Screen ========== */
.history-scroll {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px 28px;
  margin-bottom: 16px;
  max-height: 50vh;
  overflow-y: auto;
  position: relative;
}
.history-scroll::before {
  content: '';
  position: absolute;
  top: 0; left: 30px; bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--border-gold), transparent);
  opacity: 0.3;
}
.history-text {
  font-family: var(--font-title);
  font-size: 1.05rem;
  line-height: 2;
  color: var(--text-primary);
  white-space: pre-wrap;
}

.stats-summary {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.stat-change {
  text-align: center;
  padding: 12px 20px;
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid var(--border-color);
}
.stat-change .country-name-sm {
  font-family: var(--font-title);
  color: var(--accent-gold);
  margin-bottom: 6px;
}
.stat-change .changes {
  display: flex;
  gap: 12px;
  font-size: 0.9rem;
}
/* ========== History Buttons ========== */
.history-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 12px;
  flex-wrap: wrap;
}
/* ========== Bottom Panel (列国志 + 历史纪要横排) ========== */
#bottom-panel {
  margin-top: 20px;
  border-top: 1px solid var(--border-color);
  padding-top: 14px;
}

.panel-section {
  margin-bottom: 10px;
}

.panel-title {
  font-family: var(--font-title);
  color: var(--text-secondary);
  font-size: 0.95rem;
  margin: 0 0 8px;
  text-align: center;
}

/* 国家横排行 */
.countries-h-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.country-card-h {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 8px 12px;
  min-width: 140px;
  max-width: 300px;
}
.country-card-h.player-country {
  border-color: var(--accent-gold);
  box-shadow: 0 0 10px rgba(212, 168, 67, 0.15);
}
.country-card-h .cch-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.country-card-h .cch-name {
  font-family: var(--font-title);
  color: var(--accent-gold);
  font-weight: bold;
  font-size: 0.9rem;
  min-width: 40px;
}
.country-card-h .cch-stats {
  display: flex;
  gap: 8px;
  font-size: 0.8rem;
}
.country-card-h .cch-stat {
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--text-secondary);
}
.country-card-h .cch-stat-val {
  font-weight: bold;
  color: var(--text-primary);
}

/* 本回合事件列表 */
.country-card-h .cch-events {
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 5px;
}
.country-card-h .cch-event {
  font-size: 0.72rem;
  color: var(--text-muted);
  padding: 2px 0;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.country-card-h .cch-ev-title {
  color: var(--text-secondary);
  word-break: break-all;
  flex: 1;
  min-width: 0;
}

/* 历史纪要横排行 */
.history-h-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}

.history-h-row .h-entry-item {
  font-size: 0.78rem;
  color: var(--text-muted);
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 6px;
  padding: 4px 10px;
  white-space: nowrap;
}
.history-h-row .h-entry-item .he-round {
  color: var(--accent-gold);
  font-weight: bold;
}

/* ========== Loading Overlay ========== */
#loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(26, 18, 11, 0.85);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.loading-content {
  text-align: center;
}
.loading-spinner {
  font-size: 3rem;
  animation: spin 2s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
#loading-text {
  margin-top: 16px;
  color: var(--text-secondary);
  font-family: var(--font-title);
}

.btn-retry {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 32px;
  font-family: var(--font-title);
  font-size: 1rem;
  color: #1a120b;
  background: linear-gradient(135deg, #d4a843, #b8860b);
  border: 2px solid #8b6914;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 0.1em;
  transition: all 0.3s ease;
}
.btn-retry:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(180, 140, 60, 0.4);
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  border: 1px solid var(--border-gold);
  color: var(--text-primary);
  padding: 12px 28px;
  border-radius: 8px;
  z-index: 2000;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

/* ========== End Screen ========== */
.end-container {
  text-align: center;
  padding: 60px 20px;
}
.end-container .end-icon {
  font-size: 5rem;
  margin-bottom: 20px;
}
.end-container h2 {
  font-family: var(--font-title);
  font-size: 2rem;
  margin-bottom: 16px;
}
.end-container .end-result {
  font-size: 1.3rem;
  color: var(--text-secondary);
  margin-bottom: 32px;
}
.end-container .end-summary {
  max-width: 600px;
  margin: 0 auto 32px;
  text-align: left;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 24px;
  line-height: 1.8;
}

.ending-narrative {
  background: rgba(212, 168, 67, 0.06);
  border: 1px solid rgba(212, 168, 67, 0.2);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 20px;
}

.ending-text {
  font-family: var(--font-title);
  font-size: 0.95rem;
  line-height: 1.9;
  color: var(--text-primary);
}

.ending-text p {
  margin-bottom: 10px;
}

.final-scores {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.final-score-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  font-size: 0.95rem;
}
.final-score-row.player-row {
  border: 1px solid var(--accent-gold);
  background: rgba(212, 168, 67, 0.08);
}
.fs-rank { font-size: 1.3rem; min-width: 32px; }
.fs-name {
  font-family: var(--font-title);
  color: var(--accent-gold);
  min-width: 60px;
  font-weight: bold;
}
.fs-detail {
  flex: 1;
  color: var(--text-secondary);
  font-size: 0.85rem;
}
.fs-total {
  font-weight: bold;
  color: var(--text-primary);
  font-size: 1.1rem;
  min-width: 60px;
  text-align: right;
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: var(--border-gold); }

/* ========== Responsive ========== */
@media (max-width: 900px) {
  .events-layout { grid-template-columns: 1fr; }
  .countries-h-row { gap: 6px; }
  .country-card-h { min-width: 110px; padding: 6px 10px; }
  .history-h-row { gap: 4px; }
  #main-content { padding: 8px; }
}

</style>
</head>
<body>
  <div id="app">
    <!-- 顶部导航栏 -->
    <header id="header">
      <h1 class="game-title">🏰构史模拟器</h1>
      <div id="round-info" class="hidden">
        <span class="round-label">第</span>
        <span id="round-num">1</span>
        <span class="round-label">回合</span>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="main-content">
      <!-- 阶段0: 启动画面 -->
      <div id="screen-start" class="screen">
        <div class="start-container">
          <div class="emblem">📜</div>
          <h2>欢迎来到构史模拟器</h2>
          <p class="subtitle">在架空的历史长河中，书写属于你的文明篇章</p>
          <div class="api-config" id="api-config">
            <div class="api-key-section">
              <input type="password" id="api-key-input" placeholder="输入 DeepSeek API Key (sk-...)" class="api-key-field">
              <p class="hint">🔒 API Key 不会保存</p>
            </div>
          </div>
          <button id="btn-start" class="btn-primary" disabled>开始构史</button>
          <p id="config-status" class="hint"></p>
        </div>
      </div>

      <!-- 阶段1: 选择国家 -->
      <div id="screen-select" class="screen hidden">
        <h2 class="phase-title">选择你的文明</h2>
        <p class="phase-desc">AI正在生成五个国家的历史背景...</p>
        <div id="countries-container" class="countries-grid">
          <div class="loading-spinner">⏳</div>
        </div>
      </div>

      <!-- 阶段2: 选取事件 -->
      <div id="screen-events" class="screen hidden">
        <h2 class="phase-title">选取历史事件</h2>
        <p class="phase-desc">从6个事件中选择4个，拖拽排序以决定发生顺序</p>
        <div class="events-layout">
          <div class="events-pool">
            <h3>📋 可选事件 (<span id="pool-count">6</span>)</h3>
            <div id="events-pool-list" class="event-list"></div>
          </div>
          <div class="events-selected">
            <h3>✅ 已选事件 (<span id="selected-count">0</span>/4)</h3>
            <div id="events-selected-list" class="event-list"></div>
          </div>
        </div>
        <button id="btn-confirm-events" class="btn-primary" disabled>确认选择，生成历史</button>
      </div>

      <!-- 阶段3: 历史叙述 -->

// ===== js\ai.js =====
/**
 * AI接口层 - 直接调用 DeepSeek API
 */

const AIInterface = {
  apiKey: '',

  /**
   * 设置API Key
   */
  setDirectMode(apiKey) {
    this.apiKey = apiKey;
  },

  /**
   * 直连DeepSeek API
   */
  async _call(bodyData, timeoutMs = 120000) {
    if (!this.apiKey) {
      throw new Error('请先设置 DeepSeek API Key');
    }

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);

    try {
      const resp = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${this.apiKey}`
        },
        body: JSON.stringify({
          model: 'deepseek-v4-flash',
          messages: [{ role: 'user', content: bodyData.prompt || bodyData.messages?.[0]?.content }],
          temperature: bodyData.temperature || 0.8,
          max_tokens: bodyData.maxTokens || 4096,
          response_format: { type: 'json_object' },
          thinking: { type: 'disabled' }
        }),
        signal: controller.signal
      });

      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`DeepSeek API 错误 (${resp.status}): ${errText}`);
      }

      const data = await resp.json();
      return JSON.parse(data.choices[0].message.content);
    } finally {
      clearTimeout(timer);
    }
  },

  /**
   * 生成初始五个国家（每国三值总和固定为30）
   */
  async generateCountries() {
    const prompt = `你是一个架空历史模拟游戏的AI。请生成5个虚构国家的历史背景。

要求：
1. 每个国家需要包含：名称（不能直接使用现实国家名称）、历史背景描述（80-120字）、科技值、文化值、金融值
2. 每个国家的科技值、文化值、金融值的大小符合该国背景描述中所体现的国家特征
3. 每个国家的科技值+文化值+金融值必须恰好等于30，各项在5-15之间浮动
4. 五个国家的背景应该各有特色且明显不同，基于不同文明体系且参考真实历史演化逻辑
5. 背景要有一定的真实感和深度，初始背景应该基于远古至古典时代的时代特征

请严格按照以下JSON格式返回：
{
  "countries": [
    {
      "name": "国家名",
      "background": "历史背景描述...",
      "tech": 数字(5-15),
      "culture": 数字(5-15),
      "finance": 数字(5-15)
    }
  ]
}
注意：每个国家的tech+culture+finance必须等于30。`;

    return this._call({ prompt });
  },

  /**
   * 根据回合数返回时代背景描述
   */
  _getEraContext(round) {
    const eras = [
      { max: 1, name: '远古至古典时代', style: '青铜兵器、城邦雏形、原始信仰、早期农耕、文字萌芽、部落征伐',
        eventThemes: '城邦建立、青铜冶炼、文字创制、原始信仰改革、部落统一战争、灌溉工程、早期法典、神话史诗编撰' },
      { max: 3, name: '中古至封建时代', style: '铁器普及、帝国兴衰、宗教兴盛、丝绸之路、骑士与城堡、科举与门阀',
        eventThemes: '帝国扩张、宗教改革、远洋探索、封建制度、骑兵战术、造纸与印刷、大学建立、黑死病与人口变革' },
      { max: 5, name: '文艺复兴至启蒙时代', style: '人文主义、科学革命、大航海、重商主义、启蒙思想、火器普及',
        eventThemes: '科学发现、海外殖民、思想启蒙、金融革命（银行与股票）、产业萌芽、军事改革、文化复兴运动' },
      { max: 7, name: '工业革命至近代', style: '蒸汽与铁路、民族国家、宪政改革、工业化、电报与报纸、世界大战',
        eventThemes: '工业革命、铁路建设、民族独立运动、宪政改革、金融体系建立、电力应用、现代教育普及、劳工运动' },
      { max: 8, name: '现代至信息时代', style: '全球化、信息革命、核能与航天、金融资本、人工智能、生态危机',
        eventThemes: '信息技术突破、全球化贸易、太空探索、核能应用、金融衍生品、生态保护运动、人工智能崛起、基因工程' }
    ];
    for (const era of eras) {
      if (round <= era.max) return era;
    }
    return eras[eras.length - 1];
  },

  /**
   * 生成10个历史事件（围绕玩家所选国家，供玩家挑选）
   */
  async generateEvents(round, playerCountry, allCountries, worldHistory) {
    const playerName = playerCountry.name;
    const allCountryNames = allCountries.map(c => c.name).join('、');
    const playerBg = playerCountry.background || '';
    const playerStats = `科技${playerCountry.tech} 文化${playerCountry.culture} 金融${playerCountry.finance}`;
    const era = this._getEraContext(round);

    const historySummary = worldHistory.map(h =>
      `第${h.round}回合：${h.summary}`
    ).join('\n');

    const valueHint = round <= 4
      ? '事件只能影响科技值和文化值，金融值变化必须为0。每个事件的科技值+文化值变化总和必须大于0且小于4，单项变化范围-3到+3。'
      : '事件可以影响科技值、文化值和金融值。每个事件的科技值+文化值变化总和必须大于0且小于4。金融值变化幅度可较大（-4到+8）。科技值、文化值变化范围-5到+5。';

    const prompt = `你是一个架空历史模拟游戏的AI。现在是第${round}回合，时代背景为【${era.name}】。

时代特征：${era.style}
适合本时代的事件主题：${era.eventThemes}

请围绕玩家国家"${playerName}"的历史背景，生成6个可能发生在该国的历史事件，供玩家挑选4个。事件的风格和内容必须符合${era.name}的时代特征。

玩家国家：${playerName}
该国背景：${playerBg}
该国当前状态：${playerStats}
世界上的其他国家：${allCountryNames}

已有世界历史：
${historySummary || '（游戏刚开始，尚无历史）'}

要求：
1. 每个事件必须影响玩家国家"${playerName}"（targetCountry必须是"${playerName}"），事件应贴合该国的历史背景和${era.name}的时代脉络
2. 事件标题（10-20字）、描述（30-60字），参考真实历史但又带有架空特色，语言风格符合${era.name}
3. 事件应有好有坏，好坏比例约5:5
4. ${valueHint}
5. 各项数值上限为60，下限为0
6. 事件之间可以有潜在关联性，部分事件可以组成"事件链"
7. 事件要覆盖内政、军事、文化、外交、经济等不同方向，避免重复表达
8. 可适当涉及与其他国家的互动（外交、贸易、战争等），但主体仍是玩家国家内部事件

请严格按照以下JSON格式返回：
{
  "events": [
    {
      "title": "事件标题",
      "description": "事件描述（30-60字）",
      "targetCountry": "${playerName}",
      "techChange": 数字,
      "cultureChange": 数字,
      "financeChange": 数字
    }
  ]
}`;

    return this._call({ prompt, round, playerCountry, allCountries, worldHistory });
  },

  /**
   * 为一个AI国家生成4个专属历史事件
   */
  async generateAICountryEvents(round, aiCountryName, allCountries, worldHistory, playerCountryName) {
    const countryNames = allCountries.map(c => c.name).join('、');
    const era = this._getEraContext(round);
    const historySummary = worldHistory.map(h =>
      `第${h.round}回合：${h.summary}`
    ).join('\n');

    const valueHint = round <= 4
      ? '事件只能影响科技值和文化值，金融值变化必须为0。每个事件的科技值+文化值变化总和必须大于0且小于4，单项变化范围-2到+3。'
      : '事件可以影响科技值、文化值和金融值。每个事件的科技值+文化值变化总和必须大于0且小于4。金融值变化幅度较大（-5到+10）。科技值、文化值变化范围-5到+5。';

    const prompt = `你是一个架空历史模拟游戏的AI。现在是第${round}回合，时代背景为【${era.name}】（${era.style}）。

请为AI控制的国家"${aiCountryName}"生成4个历史事件，事件风格必须符合${era.name}的时代特征。适合本时代的事件主题：${era.eventThemes}

所有国家：${countryNames}
玩家控制的国家是"${playerCountryName}"。

已有世界历史：
${historySummary || '（游戏刚开始，尚无历史）'}

要求：
1. 每个事件需要包含：标题（10-20字）、描述（30-60字）、影响的国家名（必须是${aiCountryName}）、对科技/文化/金融值的影响
2. 事件应贴合${aiCountryName}的历史背景和${era.name}的时代发展脉络
3. 事件有好有坏，比例约5:5
4. ${valueHint}
5. 各项数值上限为60，下限为0
6. 事件之间可以有潜在关联性，部分事件可以组成"事件链"
7. 事件要覆盖内政、军事、文化、外交、经济等不同方向，避免重复表达
8. 可适当涉及与其他国家的互动（外交、贸易、战争等），尤其是玩家国家"${playerCountryName}"，但主体仍是国家内部事件

请严格按照以下JSON格式返回：
{
  "events": [
    {
      "title": "事件标题",
      "description": "事件描述（30-60字）",
      "targetCountry": "${aiCountryName}",
      "techChange": 数字,
      "cultureChange": 数字,
      "financeChange": 数字
    }
  ]
}`;

    return this._call({ prompt, round, aiCountryName, allCountries, worldHistory, playerCountryName });
  },

  /**
   * 根据事件组合生成虚构历史
   */
  async generateHistory(round, countries, playerCountry, playerEvents, aiEvents, previousHistory, maxRounds) {
    const playerEventText = playerEvents.map((e, i) => `${i + 1}. ${e.title}：${e.description}`).join('\n');
    const aiEventText = aiEvents.map((e, i) => `${i + 1}. ${e.title}：${e.description}（发生于${e.targetCountry}）`).join('\n');
    const era = this._getEraContext(round);

    // 计算各国事件执行后的预期数值
    const projected = {};
    for (const c of countries) {
      projected[c.name] = { tech: c.tech, culture: c.culture, finance: c.finance };
    }
    for (const evt of [...playerEvents, ...aiEvents]) {
      const p = projected[evt.targetCountry];
      if (!p) continue;
      p.tech += (evt.techChange || 0);
      p.culture += (evt.cultureChange || 0);
      p.finance += (evt.financeChange || 0);
    }

    // 生成灭亡预警
    const dyingCountries = [];
    for (const c of countries) {
      if (c.destroyed) continue;
      const p = projected[c.name];
      const deaths = [];
      if (p.tech <= 0) deaths.push(`科技降至${p.tech}(≤0)`);
      if (p.culture <= 0) deaths.push(`文化降至${p.culture}(≤0)`);
      if (p.finance <= 0) deaths.push(`财政降至${p.finance}(≤0)`);
      if (deaths.length > 0) {
        dyingCountries.push(`${c.name}（${deaths.join('，')}）`);
      }
    }

    const doomHint = dyingCountries.length > 0
      ? `根据本回合事件的影响，以下国家将在本回合灭亡：\n` + dyingCountries.map(d => `  · ${d}`).join('\n')
      : '';

    const countryStatus = countries.map(c => {
      const p = projected[c.name];
      return `${c.name}：原科技${c.tech}→${p.tech} 原文化${c.culture}→${p.culture} 原金融${c.finance}→${p.finance}${c.destroyed ? '(已灭亡)' : ''}`;
    }).join('，');

    const roundContext = round >= maxRounds
      ? `这是最后一个回合（第${round}回合），本回合结束后将进行最终结算。`
      : round >= maxRounds - 2
        ? `游戏即将进入尾声（第${round}/${maxRounds}回合），事件影响应适度加大以推动终局。`
        : '';

    const prompt = `你是一个架空历史模拟游戏的AI。请根据本回合各国发生的历史事件及其发生顺序，撰写一段精彩的虚构历史叙述。

当前是第${round}回合（共${maxRounds}回合），时代为【${era.name}】。${roundContext}
叙述的语言风格应符合${era.name}的史书笔法（${era.style}）。

各国数值变化（原始→事件后）：${countryStatus}

${doomHint}

玩家国家"${playerCountry}"按先后顺序发生的事件：
${playerEventText}

其他国家发生的事件：
${aiEventText}

要求：
1. 撰写一段400-1000字的历史故事
2. 必须严格按照事件的先后顺序来叙述，先发生的事先写，体现出事件之间的因果链条
3. 如果某个国家在本回合灭亡，则根据发生事件描写该国灭亡的原因和过程，需强调该国灭亡
4. 对某个国家可适当涉及与其他国家的互动，但主体仍是这个国家的内部事件
5. 每个国家的故事单独分段，换行隔开；每段直接进行叙述，不要出现例如“（国家名）：（叙述）”的写法
6. 语言为通俗易懂的白话史书体，避免完全的文言文，但不失文学性
7. 根据事件顺序的合理性和连贯性，额外调整各国的科技/文化/金融值（在-4到+5之间）
8. 事件前后衔接越顺畅，正面加成越大；如果顺序明显矛盾则适当负面调整
9. 如果某个国家在本回合灭亡，其他国家根据其影响程度进行适当正面或负面调整
10. 如果某个国家已灭亡，其调整值应为0
11. 对玩家国家"${playerCountry}"适当减小正面加成但不增大负面调整
12. 第${maxRounds - 2}回合开始显著增强调整幅度，使游戏尽快进入结局
13. 叙述严格避免直接出现数值调整的说法或精确数值，也不要直接出现在某一回合的说法

请严格按照以下JSON格式返回：
{
  "historyText": "虚构历史故事...",
  "adjustments": {
    "每个存活国家名": { "tech": 数字, "culture": 数字, "finance": 数字 }
  },
  "summary": "一句话概括本回合（30字以内）"
}`;

    return this._call({
      prompt, round, countries, playerCountry, playerEvents, aiEvents, previousHistory, maxRounds
    });
  },

  /**
   * 生成游戏结局叙述（灭亡记录或盛世大发展）
   */
  async generateEnding(endResult, worldHistory, maxRounds) {
    const countryName = endResult.country?.name || '';
    const reason = endResult.reason || '';
    const endType = endResult.type || '';

    const historySummary = worldHistory.map(h =>
      `[第${h.round}回合] ${h.summary}`
    ).join('\n');

    // 根据结局类型判断：胜利/ai_victory → 大发展，death/final_scoring失败 → 灭亡记录
    const isRise = endType === 'victory' || endType === 'ai_victory' || endType === 'last_standing';

    const topic = isRise
      ? `${countryName}以${reason}，请撰写一段"盛世大发展"的历史叙述，描述该国如何登峰造极、开创辉煌时代。`
      : `${countryName}因${reason}，请撰写一段"灭亡记录"的历史叙述，描述该国覆灭的详细过程和原因。`;

    const prompt = `你是一个架空历史模拟游戏的AI。游戏已经结束，请为这局游戏撰写一段最终的结局篇章。

游戏共进行了${worldHistory.length}回合（上限${maxRounds}回合）。

${topic}

世界历史概要：
${historySummary}

要求：
1. 撰写一段300-500字的结局叙述
2. 如果是胜利结局，描述该国发展的巅峰成就与辉煌景象，并适当延申后续发展，但必须基于已有历史合理推断
3. 如果是灭亡结局，详细描写该国崩溃的历程与教训
4. 结局叙述严格参考之前的历史
5. 语言通俗易懂，有史诗感和宿命感，适当总结历史规律
6. 不要直接出现在某一回合的说法

请严格按照以下JSON格式返回：
{
  "endingText": "结局叙述..."
}`;

    return this._call({ prompt });
  }
};

/**
 * 游戏状态管理
 * 管理所有游戏数据的中央状态存储
 */

const GameState = {
  // 游戏阶段: 'start' | 'select' | 'events' | 'history' | 'end'
  phase: 'start',

  // 回合数
  round: 0,

  // 最大回合数（第10回合结束时强制结算）
  maxRounds: 10,

  // 五个国家
  countries: [],

  // 玩家选择的国家索引
  playerIndex: -1,

  // 当前回合：给玩家选择的事件池（6个）
  playerEventPool: [],

  // 玩家选择的4个事件（有序）
  selectedEvents: [],

  // AI国家各自的事件（每个AI国家4个）
  aiCountryEvents: {}, // { "国家名": [events] }

  // 世界历史记录
  worldHistory: [],

  // 游戏结果: null | 'win' | 'lose'
  gameResult: null,

  /**
   * 获取玩家国家
   */
  getPlayerCountry() {
    return this.countries[this.playerIndex] || null;
  },

  /**
   * 获取存活的AI国家列表
   */
  getAICountries() {
    return this.countries.filter((_, i) => i !== this.playerIndex && !this.countries[i].destroyed);
  },

  /**
   * 检查胜利/失败条件（在每回合历史生成后调用）
   * 任意值降到0 → 亡国
   * 任意值升到最大值(60) → 胜利
   */
  checkGameEnd() {
    const player = this.getPlayerCountry();
    if (!player) return null;

    // 检查玩家失败
    if (player.tech <= 0 || player.culture <= 0 || player.finance <= 0) {
      this.gameResult = 'lose';
      return { result: 'lose', country: player, reason: this._getDeathReason(player), type: 'death' };
    }

    // 标记AI国家灭亡
    for (const c of this.getAICountries()) {
      if (c.tech <= 0 || c.culture <= 0 || c.finance <= 0) {
        c.destroyed = true;
      }
    }

    // 收集所有达成胜利条件的国家（任意值≥60），总分最高者胜
    const allCandidates = [player, ...this.getAICountries()].filter(c =>
      c.tech >= 60 || c.culture >= 60 || c.finance >= 60
    );
    if (allCandidates.length > 0) {
      const winner = allCandidates.reduce((a, b) =>
        (a.tech + a.culture + a.finance) >= (b.tech + b.culture + b.finance) ? a : b
      );
      if (winner === player) {
        this.gameResult = 'win';
        return { result: 'win', country: player, reason: this._getVictoryReason(player), type: 'victory' };
      } else {
        this.gameResult = 'lose';
        return { result: 'lose', country: winner, reason: `${winner.name}率先登峰造极，你的文明黯然失色...`, type: 'ai_victory' };
      }
    }

    // 最后幸存者直接胜利
    const alive = this.countries.filter(c => !c.destroyed);
    if (alive.length === 1) {
      const last = alive[0];
      if (last === player) {
        this.gameResult = 'win';
        return { result: 'win', country: player, reason: `${player.name}成为世界上唯一的文明，统一了天下！`, type: 'last_standing' };
      } else {
        this.gameResult = 'lose';
        return { result: 'lose', country: last, reason: `${last.name}成为世界上唯一的文明，你的国家被历史遗忘...`, type: 'last_standing' };
      }
    }

    return null;
  },

  /**
   * 第10回合结束时的最终结算
   * 计算每个存活的国家的数值总和，最高者获胜
   */
  finalScoring() {
    const alive = this.countries.filter(c => !c.destroyed);
    if (alive.length === 0) return { result: 'lose', reason: '所有文明都已消亡...' };

    // 计算每个国家的总和
    const scored = alive.map(c => ({
      name: c.name,
      total: c.tech + c.culture + c.finance,
      tech: c.tech,
      culture: c.culture,
      finance: c.finance
    })).sort((a, b) => b.total - a.total);

    const player = this.getPlayerCountry();
    const playerScore = scored.find(s => s.name === player.name);
    const isPlayerWin = scored[0].name === player.name;

    this.gameResult = isPlayerWin ? 'win' : 'lose';

    return {
      result: this.gameResult,
      type: 'final_scoring',
      scores: scored,
      playerScore: playerScore,
      isPlayerWin: isPlayerWin,
      reason: isPlayerWin
        ? `${player.name}以总和${playerScore.total}点位居榜首，赢得了历史的认可！`
        : `${scored[0].name}以总和${scored[0].total}点领先，${player.name}仅获${playerScore.total}点...`
    };
  },

  _getDeathReason(country) {
    const parts = [];
    if (country.tech <= 0) parts.push('科技衰微');
    if (country.culture <= 0) parts.push('文化断绝');
    if (country.finance <= 0) parts.push('财政崩溃');
    return `${country.name}因${parts.join('、')}而亡国`;
  },

  _getVictoryReason(country) {
    const parts = [];
    if (country.tech >= 60) parts.push('科技登峰造极');
    if (country.culture >= 60) parts.push('文化光耀万世');
    if (country.finance >= 60) parts.push('财富冠绝天下');
    return `${country.name}以${parts.join('、')}开创了不世辉煌！`;
  },

  /**
   * 应用事件效果到国家（不钳位，允许暂时为负）
   */
  applyEvent(event) {
    const country = this.countries.find(c => c.name === event.targetCountry);
    if (!country || country.destroyed) return;

    country.tech += (event.techChange || 0);
    country.culture += (event.cultureChange || 0);
    country.finance += (event.financeChange || 0);
  },

  /**
   * 应用AI历史调整（不钳位）
   */
  applyAdjustments(adjustments) {
    for (const [name, adj] of Object.entries(adjustments)) {
      const country = this.countries.find(c => c.name === name);
      if (!country || country.destroyed) continue;
      country.tech += (adj.tech || 0);
      country.culture += (adj.culture || 0);
      country.finance += (adj.finance || 0);
    }
  },

  /**
   * 最终钳位：将≤0的值强制归0，>60的钳位到60
   */
  clampAll() {
    for (const c of this.countries) {
      if (c.destroyed) { c.tech = 0; c.culture = 0; c.finance = 0; continue; }
      c.tech = Math.max(0, Math.min(60, c.tech));
      c.culture = Math.max(0, Math.min(60, c.culture));
      c.finance = Math.max(0, Math.min(60, c.finance));
    }
  },

  /**
   * 重置状态
   */
  reset() {
    this.phase = 'start';
    this.round = 0;
    this.countries = [];
    this.playerIndex = -1;
    this.playerEventPool = [];
    this.selectedEvents = [];
    this.aiCountryEvents = {};
    this.worldHistory = [];
    this.gameResult = null;
    this._pendingEndResult = null;
  }
};


// ===== js\game.js =====
/**
 * 游戏核心控制器
 * 管理游戏流程和阶段转换
 */

const GameController = {
  /** 保存当前可重试的操作 */
  _retryAction: null,

  /** 设置重试操作 */
  _setRetry(action) {
    this._retryAction = action;
    UI.showRetryButton(); // 加载遮罩上显示重试按钮
  },

  /**
   * 重试上一次失败的操作
   */
  retry() {
    if (this._retryAction) {
      UI.showLoading('');
      this._retryAction();
    }
  },

  /**
   * 开始新游戏
   */
  async startNewGame() {
    GameState.reset();
    UI.showLoading('正在生成国家...');

    try {
      const data = await AIInterface.generateCountries();
      GameState.countries = data.countries.map(c => ({
        name: c.name,
        background: c.background,
        tech: c.tech,
        culture: c.culture,
        finance: c.finance,
        destroyed: false
      }));
      GameState.phase = 'select';
      this._retryAction = null;
      UI.hideLoading();
      UI.showScreen('select');
      UI.renderCountries();
    } catch (err) {
      console.error(err);
      UI.hideLoading();
      UI.showToast('生成国家失败: ' + err.message, true);
      this._setRetry(() => this.startNewGame());
    }
  },

  /**
   * 玩家选择国家
   */
  selectCountry(index) {
    GameState.playerIndex = index;
    GameState.round = 1;
    UI.renderCountries();
    UI.updateBottomPanel();

    setTimeout(() => this.startRound(), 800);
  },

  /**
   * 开始新回合：生成玩家事件池 + AI国家各自的事件
   */
  async startRound() {
    GameState.phase = 'events';
    GameState.selectedEvents = [];
    GameState.aiCountryEvents = {};
    GameState.playerEventPool = [];

    UI.showLoading(`正在构思第 ${GameState.round} 回合的历史事件...`);

    try {
      const playerCountry = GameState.getPlayerCountry();
      const activeCountries = GameState.countries.filter(c => !c.destroyed);
      const aiCountries = GameState.getAICountries();

      // 并行生成：玩家国家事件池 + 每个AI国家各4个事件
      const tasks = [
        AIInterface.generateEvents(GameState.round, playerCountry, activeCountries, GameState.worldHistory)
      ];

      for (const aiCountry of aiCountries) {
        tasks.push(
          AIInterface.generateAICountryEvents(
            GameState.round,
            aiCountry.name,
            activeCountries,
            GameState.worldHistory,
            playerCountry.name
          )
        );
      }

      const results = await Promise.all(tasks);

      // 第一个结果是玩家事件池
      GameState.playerEventPool = results[0].events || [];

      // 后续结果是各AI国家的事件
      for (let i = 0; i < aiCountries.length; i++) {
        const aiData = results[i + 1];
        GameState.aiCountryEvents[aiCountries[i].name] = aiData.events || [];
      }

      UI.hideLoading();
      UI.showScreen('events');
      UI.updateBottomPanel();
      UI.renderEvents();
      this._retryAction = null;
    } catch (err) {
      console.error(err);
      UI.hideLoading();
      UI.showToast('生成事件失败: ' + err.message, true);
      this._setRetry(() => this.startRound());
    }
  },

  /**
   * 切换事件的选中状态
   */
  toggleEvent(event) {
    const idx = GameState.selectedEvents.indexOf(event);
    if (idx >= 0) {
      GameState.selectedEvents.splice(idx, 1);
    } else {
      if (GameState.selectedEvents.length >= 4) {
        UI.showToast('最多只能选择4个事件', true);
        return;
      }
      GameState.selectedEvents.push(event);
    }
    UI.renderEvents();
    UI.updateConfirmButton();
  },

  /**
   * 确认选择，生成历史
   */
  async confirmEvents() {
    if (GameState.selectedEvents.length !== 4) {
      UI.showToast('请选择恰好4个事件', true);
      return;
    }

    // 收集所有AI事件
    const allAIEvents = [];
    for (const events of Object.values(GameState.aiCountryEvents)) {
      allAIEvents.push(...events);
    }

    const allPlayerEvents = GameState.selectedEvents;

    UI.showLoading('正在构史...');
    GameState.phase = 'history';

    try {
      const data = await AIInterface.generateHistory(
        GameState.round,
        GameState.countries.filter(c => !c.destroyed),
        GameState.getPlayerCountry().name,
        allPlayerEvents,
        allAIEvents,
        GameState.worldHistory,
        GameState.maxRounds
      );

      // 应用所有事件效果
      for (const event of [...allPlayerEvents, ...allAIEvents]) {
        GameState.applyEvent(event);
      }
      // 应用历史调整
      GameState.applyAdjustments(data.adjustments);
      // 最终钳位并判定灭亡
      GameState.clampAll();

      // 记录世界历史
      GameState.worldHistory.push({
        round: GameState.round,
        summary: data.summary,
        historyText: data.historyText,
        playerEvents: [...allPlayerEvents],
        aiEvents: [...allAIEvents],
        adjustments: data.adjustments
      });

      UI.hideLoading();
      UI.showScreen('history');
      UI.renderHistory(data);
      UI.updateBottomPanel();

      // 检查游戏结束条件
      let endResult = GameState.checkGameEnd();
      if (!endResult && GameState.round >= GameState.maxRounds) {
        endResult = GameState.finalScoring();
      }
      if (endResult) {
        GameState._pendingEndResult = endResult;
        UI.showEndButton();
        // 异步生成结局叙述
        AIInterface.generateEnding(endResult, GameState.worldHistory, GameState.maxRounds)
          .then(ending => { GameState._endingNarrative = ending; })
          .catch(() => {});
      }
      this._retryAction = null;
    } catch (err) {
      console.error(err);
      UI.hideLoading();
      UI.showToast('生成历史失败: ' + err.message, true);
      this._setRetry(() => this.confirmEvents());
    }
  },

  /**
   * 进入下一回合
   */
  nextRound() {
    if (GameState.gameResult) return;

    GameState.round++;

    // 最后一回合提示
    if (GameState.round === GameState.maxRounds) {
      UI.showToast('⚠️ 最后一回合！本回合结束后将进行最终结算');
    } else if (GameState.round === GameState.maxRounds - 1) {
      UI.showToast('⚠️ 倒数第二回合，请谨慎选择！');
    }

    this.startRound();
  },

  /**
   * 重新开始
   */
  restart() {
    this._retryAction = null;
    GameState.reset();
    UI.showScreen('start');
    UI.updateBottomPanel();
    UI.checkApiConfig();
  }
};


// ===== js\ui.js =====
/**
 * UI渲染层
 * 负责所有DOM操作和界面更新
 */

const UI = {
  // 缓存DOM引用
  els: {},

  /** 渲染单个数值变化标签 */
  _changeTag(icon, value) {
    if (value) {
      const cls = value > 0 ? 'effect-positive' : 'effect-negative';
      const sign = value > 0 ? '+' : '';
      return `<span class="${cls}">${icon}${sign}${value}</span>`;
    }
    return `<span class="effect-zero">${icon}0</span>`;
  },

  /**
   * 初始化UI，缓存DOM元素
   */
  init() {
    this.els = {
      screens: {
        start: document.getElementById('screen-start'),
        select: document.getElementById('screen-select'),
        events: document.getElementById('screen-events'),
        history: document.getElementById('screen-history'),
        end: document.getElementById('screen-end')
      },
      roundInfo: document.getElementById('round-info'),
      roundNum: document.getElementById('round-num'),
      bottomPanel: document.getElementById('bottom-panel'),
      countriesRow: document.getElementById('countries-row'),
      historyRow: document.getElementById('history-row'),
      countriesContainer: document.getElementById('countries-container'),
      eventsPool: document.getElementById('events-pool-list'),
      eventsSelected: document.getElementById('events-selected-list'),
      poolCount: document.getElementById('pool-count'),
      selectedCount: document.getElementById('selected-count'),
      btnConfirmEvents: document.getElementById('btn-confirm-events'),
      btnNextRound: document.getElementById('btn-next-round'),
      btnStart: document.getElementById('btn-start'),
      btnEnd: document.getElementById('btn-show-end'),
      historyText: document.getElementById('history-text'),
      statsSummary: document.getElementById('stats-summary'),
      loadingOverlay: document.getElementById('loading-overlay'),
      loadingText: document.getElementById('loading-text'),
      btnRetry: document.getElementById('btn-retry'),
      toast: document.getElementById('toast'),
      endContent: document.getElementById('end-content'),
      configStatus: document.getElementById('config-status'),
      apiKeyInput: document.getElementById('api-key-input')
    };

    // 事件绑定
    this.els.btnStart.addEventListener('click', () => GameController.startNewGame());
    this.els.btnConfirmEvents.addEventListener('click', () => GameController.confirmEvents());
    this.els.btnNextRound.addEventListener('click', () => GameController.nextRound());
    this.els.btnEnd.addEventListener('click', () => this.showEndScreen());

    // API Key 输入监听
    this.els.apiKeyInput.addEventListener('input', () => this.checkApiConfig());

    // 初始检查
    this.checkApiConfig();
  },

  /**
   * 检查API配置状态（仅直连模式）
   */
  async checkApiConfig() {
    const key = this.els.apiKeyInput.value.trim();
    if (key && key.startsWith('sk-')) {
      AIInterface.setDirectMode(key);
      this.els.btnStart.disabled = false;
      this.els.configStatus.textContent = '✅ API Key 已就绪，点击开始';
      this.els.configStatus.style.color = 'var(--accent-green)';
    } else if (key && !key.startsWith('sk-')) {
      this.els.btnStart.disabled = true;
      this.els.configStatus.textContent = '⚠️ API Key 格式不正确（应以 sk- 开头）';
      this.els.configStatus.style.color = 'var(--accent-red)';
    } else {
      this.els.btnStart.disabled = true;
      this.els.configStatus.textContent = '🔑 请输入 DeepSeek API Key 以开始游戏';
      this.els.configStatus.style.color = 'var(--accent-gold)';
    }
  },

  /**
   * 切换显示的屏幕
   */
  showScreen(name) {
    Object.values(this.els.screens).forEach(el => el.classList.add('hidden'));
    const screen = this.els.screens[name];
    if (screen) screen.classList.remove('hidden');

    if (name === 'start' || name === 'end') {
      this.els.bottomPanel.classList.add('hidden');
      this.els.roundInfo.classList.add('hidden');
    } else {
      this.els.bottomPanel.classList.remove('hidden');
      this.els.roundInfo.classList.remove('hidden');
    }

    // 进入历史页时复位按钮到默认状态
    if (name === 'history') {
      this.els.btnNextRound.classList.remove('hidden');
      this.els.btnEnd.classList.add('hidden');
    }
  },

  /**
   * 渲染国家选择卡片
   */
  renderCountries() {
    const container = this.els.countriesContainer;
    container.innerHTML = '';

    GameState.countries.forEach((country, index) => {
      const card = document.createElement('div');
      card.className = 'country-card';
      if (GameState.playerIndex === index) {
        card.classList.add('selected');
      }
      card.innerHTML = `
        <div class="country-name">${country.name}</div>
        <div class="country-background">${country.background}</div>
        <div class="country-stats">
          <div class="stat-item">
            <div class="stat-icon">🔬</div>
            <div class="stat-value">${country.tech}</div>
            <div class="stat-label">科技</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">🎭</div>
            <div class="stat-value">${country.culture}</div>
            <div class="stat-label">文化</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">💰</div>
            <div class="stat-value">${country.finance}</div>
            <div class="stat-label">金融</div>
          </div>
        </div>
      `;

      if (GameState.playerIndex < 0) {
        card.addEventListener('click', () => GameController.selectCountry(index));
      }

      container.appendChild(card);
    });

    this.els.screens.select.querySelector('.phase-desc').textContent =
      GameState.playerIndex >= 0
        ? '已选择 ' + GameState.countries[GameState.playerIndex].name
        : '正在生成历史背景...';
  },

  /**
   * 渲染事件列表（支持拖拽：池→选区、选区内排序、选区→池）
   */
  renderEvents() {
    const poolList = this.els.eventsPool;
    const selectedList = this.els.eventsSelected;

    poolList.innerHTML = '';
    selectedList.innerHTML = '';

    // ===== 可选事件池 =====
    GameState.playerEventPool.forEach((event, idx) => {
      const isSelected = GameState.selectedEvents.includes(event);
      if (isSelected) return;

      const card = this._createEventCard(event, 'in-pool');
      card.draggable = true;
      card.dataset.poolIndex = idx;

      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'pool:' + idx);
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('click', () => {
        if (!card.classList.contains('dragging')) GameController.toggleEvent(event);
      });

      poolList.appendChild(card);
    });

    // ===== 已选事件（可拖拽排序，也可拖回池） =====
    GameState.selectedEvents.forEach((event, index) => {
      const card = this._createEventCard(event, 'in-selected');
      card.draggable = true;
      card.dataset.eventIndex = index;

      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'selected:' + index);
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        const raw = e.dataTransfer.getData('text/plain');
        if (raw.startsWith('selected:')) {
          const from = parseInt(raw.split(':')[1]);
          if (from !== index && !isNaN(from)) this._reorderSelected(from, index);
        }
      });
      card.addEventListener('click', () => {
        if (!card.classList.contains('dragging')) GameController.toggleEvent(event);
      });

      selectedList.appendChild(card);
    });

    // ===== 列表区域接受拖放 =====
    this._setupListDropZone(poolList, 'pool');
    this._setupListDropZone(selectedList, 'selected');

    this.els.poolCount.textContent = GameState.playerEventPool.length - GameState.selectedEvents.length;
    this.els.selectedCount.textContent = GameState.selectedEvents.length;
    this.updateConfirmButton();
  },

  /**
   * 为列表设置放置区域（接收从另一列表拖来的卡片）
   */
  _setupListDropZone(listEl, zoneType) {
    listEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    listEl.addEventListener('drop', (e) => {
      e.preventDefault();
      const raw = e.dataTransfer.getData('text/plain');
      if (!raw) return;
      const [src, idxStr] = raw.split(':');
      const idx = parseInt(idxStr);
      if (isNaN(idx)) return;

      // 从池拖到选区：添加事件
      if (src === 'pool' && zoneType === 'selected') {
        const event = GameState.playerEventPool[idx];
        if (event && !GameState.selectedEvents.includes(event) && GameState.selectedEvents.length < 4) {
          GameState.selectedEvents.push(event);
          this.renderEvents();
        }
      }
      // 从选区拖到池：移除事件
      if (src === 'selected' && zoneType === 'pool') {
        GameState.selectedEvents.splice(idx, 1);
        this.renderEvents();
      }
    });
  },

  /**
   * 重新排序已选事件
   */
  _reorderSelected(fromIndex, toIndex) {
    const arr = GameState.selectedEvents;
    const [moved] = arr.splice(fromIndex, 1);
    arr.splice(toIndex, 0, moved);
    this.renderEvents();
  },

  /**
   * 创建事件卡片DOM
   */
  _createEventCard(event, cssClass) {
    const card = document.createElement('div');
    card.className = `event-card ${cssClass}`;

    const effects = [
      this._changeTag('🔬', event.techChange),
      this._changeTag('🎭', event.cultureChange),
      this._changeTag('💰', event.financeChange)
    ];

    card.innerHTML = `
      <div class="event-target">${event.targetCountry}</div>
      <div class="event-title">${event.title}</div>
      <div class="event-desc">${event.description}</div>
      <div class="event-effects">${effects.join('')}</div>
    `;

    return card;
  },

  /**
   * 更新确认按钮状态
   */
  updateConfirmButton() {
    this.els.btnConfirmEvents.disabled = GameState.selectedEvents.length !== 4;
  },

  /**
   * 渲染历史叙述
   */
  renderHistory(data) {
    this.els.historyText.textContent = data.historyText;

    // 渲染数值变化
    const summary = this.els.statsSummary;
    summary.innerHTML = '';

    for (const [name, adj] of Object.entries(data.adjustments)) {
      const country = GameState.countries.find(c => c.name === name);
      // 跳过已灭亡或本回合数值归零的国家
      if (!country || country.destroyed) continue;
      if (country.tech <= 0 || country.culture <= 0 || country.finance <= 0) continue;

      const div = document.createElement('div');
      div.className = 'stat-change';
      div.innerHTML = `
        <div class="country-name-sm">${name}</div>
        <div class="changes">
          ${this._changeTag('🔬', adj.tech)}
          ${this._changeTag('🎭', adj.culture)}
          ${this._changeTag('💰', adj.finance)}
        </div>
      `;
      summary.appendChild(div);
    }

    // 更新回合显示
    this.els.roundNum.textContent = GameState.round;
    // 在回合数旁显示进度
    const maxLabel = GameState.round >= GameState.maxRounds ? ' (最终回合)' :
      GameState.round >= GameState.maxRounds - 1 ? ` / ${GameState.maxRounds}` : '';
    // 用 round-label 显示附加上下文
    const roundLabel = document.querySelector('.round-label:last-child');
    if (roundLabel) {
      roundLabel.textContent = maxLabel || '回合';
    }

    // 更新历史纪要
    this._renderHistoryEntries();
  },

  /**
   * 渲染历史纪要（横排）
   */
  _renderHistoryEntries() {
    const container = this.els.historyRow;
    container.innerHTML = '';

    GameState.worldHistory.slice().reverse().forEach(entry => {
      const span = document.createElement('span');
      span.className = 'h-entry-item';
      span.innerHTML = `<span class="he-round">[第${entry.round}回合]</span> ${entry.summary}`;
      container.appendChild(span);
    });
  },

  /**
   * 更新底部面板（列国志横排 + 本回合事件）
   */
  updateBottomPanel() {
    if (GameState.countries.length === 0) return;

    // 收集本回合各国家的事件（仅历史/结束阶段显示AI事件）
    const countryEvents = {};
    const showAiEvents = GameState.phase === 'history' || GameState.phase === 'end';

    if (GameState.selectedEvents.length > 0) {
      for (const evt of GameState.selectedEvents) {
        const name = evt.targetCountry;
        if (!countryEvents[name]) countryEvents[name] = [];
        countryEvents[name].push(evt);
      }
    }
    if (showAiEvents) {
      for (const [cname, events] of Object.entries(GameState.aiCountryEvents)) {
        if (!countryEvents[cname]) countryEvents[cname] = [];
        countryEvents[cname].push(...events);
      }
    }

    // 列国志
    const row = this.els.countriesRow;
    row.innerHTML = '';
    GameState.countries.forEach(country => {
      const isPlayer = GameState.playerIndex >= 0 &&
        GameState.countries[GameState.playerIndex] === country;

      const div = document.createElement('div');
      div.className = 'country-card-h' + (isPlayer ? ' player-country' : '');
      if (country.destroyed) div.style.opacity = '0.4';

      let eventsHtml = '';
      const evts = countryEvents[country.name];
      if (evts && evts.length > 0) {
        eventsHtml = '<div class="cch-events">';
        for (const evt of evts) {
          const parts = [
            this._changeTag('🔬', evt.techChange),
            this._changeTag('🎭', evt.cultureChange),
            this._changeTag('💰', evt.financeChange)
          ];
          eventsHtml += `<div class="cch-event"><span class="cch-ev-title">${evt.title}</span> ${parts.join(' ')}</div>`;
        }
        eventsHtml += '</div>';
      }

      div.innerHTML = `
        <div class="cch-top">
          <span class="cch-name">${isPlayer ? '👑 ' : ''}${country.name}${country.destroyed ? '💀' : ''}</span>
          <span class="cch-stats">
            <span class="cch-stat">🔬<span class="cch-stat-val">${country.tech}</span></span>
            <span class="cch-stat">🎭<span class="cch-stat-val">${country.culture}</span></span>
            <span class="cch-stat">💰<span class="cch-stat-val">${country.finance}</span></span>
          </span>
        </div>
        ${eventsHtml}
      `;
      row.appendChild(div);
    });

    this._renderHistoryEntries();
    this.els.roundNum.textContent = GameState.round || '-';
  },

  /**
   * 显示"查看结局"按钮
   */
  showEndButton() {
    this.els.btnNextRound.classList.add('hidden');
    this.els.btnEnd.classList.remove('hidden');
  },

  /**
   * 切换到结局画面
   */
  showEndScreen() {
    if (!GameState._pendingEndResult) return;
    GameState.phase = 'end';
    this.showScreen('end');
    this.renderEndScreen(GameState._pendingEndResult);
  },

  /**
   * 渲染游戏结束画面
   */
  renderEndScreen(result) {
    const container = this.els.endContent;
    // 用 endType 而非 result 判断展示模式
    const isRise = result.type === 'victory' || result.type === 'ai_victory' || result.type === 'last_standing';
    const isPlayerWin = result.result === 'win';
    const isFinalScoring = result.type === 'final_scoring';

    let summaryHTML = '';

    if (isFinalScoring && result.scores) {
      summaryHTML = `
        <h4 style="color:var(--accent-gold);margin-bottom:12px;">📊 第${GameState.maxRounds}回合 最终结算</h4>
        <div class="final-scores">
          ${result.scores.map((s, i) => `
            <div class="final-score-row ${s.name === GameState.getPlayerCountry().name ? 'player-row' : ''}">
              <span class="fs-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'}</span>
              <span class="fs-name">${s.name}</span>
              <span class="fs-detail">🔬${s.tech} 🎭${s.culture} 💰${s.finance}</span>
              <span class="fs-total">${s.total} 点</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    summaryHTML += `
      <h4 style="color:var(--accent-gold);margin:16px 0 12px;">📜 历史总结</h4>
      ${GameState.worldHistory.map(h =>
        `<p style="margin-bottom:8px;"><strong>[第${h.round}回合]</strong> ${h.summary}</p>`
      ).join('')}
      <hr style="border-color:var(--border-color);margin:16px 0;">
      <p><strong>共经历 ${GameState.round} 个回合</strong></p>
    `;

    // 结局叙述
    let endingHTML = '';
    if (GameState._endingNarrative?.endingText) {
      endingHTML = `
        <div class="ending-narrative">
          <h4 style="color:var(--accent-gold);margin-bottom:12px;">${isRise ? '🌟 盛世华章' : '📜 灭亡记录'}</h4>
          <div class="ending-text">${GameState._endingNarrative.endingText.replace(/\n/g, '</p><p>')}</div>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="end-icon">${isPlayerWin ? '🏆' : '💀'}</div>
      <h2 style="color:${isPlayerWin ? 'var(--accent-gold)' : 'var(--accent-red)'}">
        ${isPlayerWin ? '青史留名！' : isRise ? '大势已去...' : '折戟沉沙...'}
      </h2>
      <div class="end-result">${result.reason}</div>
      <div class="end-summary">
        ${endingHTML}
        ${summaryHTML}
      </div>
      <button class="btn-primary" onclick="GameController.restart()">重新构史</button>
    `;
  },

  /**
   * 显示加载遮罩
   */
  showLoading(text) {
    this.els.btnRetry.classList.add('hidden');
    this.els.loadingText.textContent = text || 'AI正在思考...';
    this.els.loadingOverlay.classList.remove('hidden');
  },

  /**
   * 隐藏加载遮罩
   */
  hideLoading() {
    this.els.btnRetry.classList.add('hidden');
    this.els.loadingOverlay.classList.add('hidden');
  },

  /**
   * 加载失败时显示重试按钮
   */
  showRetryButton() {
    this.els.loadingText.textContent = '❌ 生成失败，检查网络或 API Key 是否正确';
    this.els.btnRetry.classList.remove('hidden');
    this.els.loadingOverlay.classList.remove('hidden');
  },

  /**
   * 显示Toast消息
   */
  showToast(message, isError = false) {
    const toast = this.els.toast;
    toast.textContent = message;
    toast.style.borderColor = isError ? 'var(--accent-red)' : 'var(--border-gold)';
    toast.classList.remove('hidden');

    // 重置动画
    toast.style.animation = 'none';
    toast.offsetHeight; // reflow
    toast.style.animation = 'toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards';

    setTimeout(() => toast.classList.add('hidden'), 2800);
  }
};
